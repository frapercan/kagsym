[project]
name = "kagsym"
version = "0.1.0"
description = "Neurosymbolic agent for the Kaggriculture competition"
requires-python = ">=3.10,<3.13"   # kaggle-environments pulls pygame, no wheel for 3.14
dependencies = [
    "kaggle-environments",
    "numpy",
    "torch",
]

[project.optional-dependencies]
ladder = ["kaggle"]          # CLI and API for replays and the leaderboard
tracking = ["mlflow"]        # experiment tracking (optional, degrades to a no-op)

[tool.setuptools.packages.find]
include = ["kagsym*"]
